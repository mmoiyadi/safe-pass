services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pm
      POSTGRES_PASSWORD: pm
      POSTGRES_DB: pm
    ports:
      - '5432:5432'
    volumes:
      - pmdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pm -d pm']
      interval: 5s
      timeout: 5s
      retries: 10

  # Captures notification email so quickstart V13 can assert an invitation
  # discloses no vault name (FR-066). Web UI on http://localhost:8025
  mail:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  pmdata:
